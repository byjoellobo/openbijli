name: Release

# Versions and releases come from Conventional Commits via release-please:
#   1. Every push to main updates a "chore: release X.Y.Z" pull request with the next version
#      (one lockstep version for every package) and the new CHANGELOG.md entry.
#   2. Merging that pull request tags vX.Y.Z and publishes the GitHub Release.
#   3. The jobs below attach build artifacts to the release and, if enabled, publish to npm.
#      They live in this workflow because a release created with GITHUB_TOKEN does not trigger
#      other workflows.
# Run it by hand with an existing tag (for example v0.1.0) to rebuild and re-upload its assets.
# See docs/releasing.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild assets for (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Pull requests opened with GITHUB_TOKEN do not trigger CI. An optional fine-grained
          # token (contents and pull requests: read/write) lets CI run on the release PR.
          # Without it, close and reopen the release PR to run the checks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  assets:
    name: Build and attach release assets
    needs: release-please
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
      id-token: write # sign the provenance attestation
      attestations: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Check the tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z tag"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - name: Only build releases whose commit is on main
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data:check
      - run: npm test
      - run: npm run build
      - name: Rebuild the web app with relative paths so it runs from any folder or host
        run: npm run build -w @openbijli/web
        env:
          BASE_PATH: ./
      - name: Package the assets
        run: |
          set -euo pipefail
          out=dist-release
          mkdir -p "$out"
          for pkg in packages/data packages/engine packages/evidence; do
            npm pack --workspace "$pkg" --pack-destination "$out" --ignore-scripts
          done
          (cd apps/web/dist && zip -qr "../../../$out/openbijli-web-$TAG.zip" .)
          zip -qr "$out/openbijli-data-$TAG.zip" data
          (cd "$out" && sha256sum -- * > SHA256SUMS.txt)
          ls -l "$out"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist-release/*
      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist-release/* --clobber

  npm-publish:
    name: Publish to npm
    # Off until the packages are set up on npmjs.com: set the repository variable
    # NPM_PUBLISH=true and configure npm trusted publishing (OIDC, no token) for
    # @openbijli/data, /engine and /evidence with this repository and workflow file.
    # Add required reviewers to the npm-release environment and protect v* tags.
    needs: [release-please, assets]
    if: needs.release-please.outputs.release_created == 'true' && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Publish packages in dependency order
        run: |
          for pkg in packages/data packages/engine packages/evidence; do
            npm publish --workspace "$pkg" --access public --provenance --ignore-scripts
          done

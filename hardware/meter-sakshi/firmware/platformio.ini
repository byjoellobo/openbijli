; Meter Sakshi firmware
; Build:  pio run -e esp32dev        Flash: pio run -e esp32dev -t upload
; Tests:  pio test -e native         (portable core: SHA-256, record format, pulse filter)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_flags =
  -std=gnu++17
  -DSAKSHI_FIRMWARE_VERSION=\"0.1.0\"
  ; -DSAKSHI_USE_DS3231   ; uncomment if a DS3231 RTC is fitted on I2C (SDA 21, SCL 22)
lib_deps =
  adafruit/RTClib@^2.1.4
test_ignore = *

[env:native]
platform = native
build_flags = -std=c++17
test_framework = unity
lib_compat_mode = off
